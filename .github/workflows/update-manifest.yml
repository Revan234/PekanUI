name: Sync UI update manifest

on:
  push:
    branches:
      - main
    paths:
      - "uijtrp.lua"
      - "uijtrp/**"
      - "update-manifest.txt"
      - "New-UpdateManifest.ps1"
      - ".github/workflows/update-manifest.yml"
  pull_request:
    paths:
      - "uijtrp.lua"
      - "uijtrp/**"
      - "update-manifest.txt"
      - "New-UpdateManifest.ps1"
      - ".github/workflows/update-manifest.yml"

permissions:
  contents: write

jobs:
  sync-manifest:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate manifest in pull requests
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./New-UpdateManifest.ps1 -Check

      - name: Generate manifest after pushes
        if: github.event_name == 'push'
        shell: pwsh
        run: ./New-UpdateManifest.ps1

      - name: Commit generated manifest
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git diff --exit-code --quiet -- update-manifest.txt
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Manifest sudah sinkron."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update-manifest.txt
          git commit -m "chore: sync UI update manifest"
          git push
